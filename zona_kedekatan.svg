<svg xmlns="http://www.w3.org/2000/svg" width="770" height="515" viewBox="0 0 770 515" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="titleG" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="zoneG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/>
    </radialGradient>
    <radialGradient id="indukG" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#e5e7eb"/><stop offset="1" stop-color="#9ca3af"/>
    </radialGradient>
    <linearGradient id="anakG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ade80"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="anakOutG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d1d5db"/><stop offset="1" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrG" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
    <clipPath id="card"><rect x="5" y="16" width="760" height="482" rx="18"/></clipPath>
  </defs>

  <rect width="770" height="515" fill="#ffffff"/>
  <!-- card -->
  <rect x="5" y="16" width="760" height="482" rx="18" fill="url(#bgG)"/>
  <g clip-path="url(#card)">
    <rect x="5" y="16" width="760" height="48" fill="url(#titleG)"/>
  </g>
  <text x="385" y="48" text-anchor="middle" font-size="23" font-weight="800" fill="#ffffff" letter-spacing="0.3">Zona Kedekatan Anak dan Induk Domba</text>
  <line x1="5" y1="64" x2="765" y2="64" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="5" y="16" width="760" height="482" rx="18" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-dasharray="8 6"/>

  <!-- area label -->
  <g filter="url(#sh)">
    <rect x="20" y="78" width="182" height="28" rx="14" fill="#1e293b"/>
  </g>
  <g transform="translate(34,85)" fill="#fbbf24">
    <rect x="0" y="2" width="15" height="11" rx="2.5"/>
    <path d="M15,5.5 L21,2.5 L21,12.5 L15,9.5 z"/>
  </g>
  <text x="62" y="97" font-size="13" font-weight="700" fill="#ffffff">Area Kandang CCTV</text>

  <!-- proximity zone -->
    <circle cx="389" cy="241" r="178" fill="url(#zoneG)" stroke="#2563eb" stroke-width="3" filter="url(#sh)"/>
  <circle cx="389" cy="241" r="140" fill="none" stroke="#60a5fa" stroke-width="1.2" stroke-dasharray="4 5" opacity="0.7"/>

  <!-- udder zone (orange) -->
  <path d="M 287 290 A 104 104 0 0 0 473 290" fill="none" stroke="#fde68a" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
  <path d="M 287 290 A 104 104 0 0 0 473 290" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="291" y1="222" x2="291" y2="300" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="469" y1="222" x2="469" y2="300" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- induk -->
  <circle cx="380" cy="238" r="84" fill="url(#indukG)" stroke="#334155" stroke-width="3" filter="url(#sh)"/>
  <text x="380" y="236" text-anchor="middle" font-size="25" font-weight="800" fill="#1e293b">Induk</text>
  <rect x="331" y="248" width="98" height="22" rx="11" fill="#334155"/>
  <text x="380" y="263" text-anchor="middle" font-size="11.5" font-weight="600" fill="#f8fafc">titik acuan</text>

  <!-- approach arrow -->
  <line x1="135" y1="234" x2="282" y2="240" stroke="#16a34a" stroke-width="3" stroke-dasharray="7 4" marker-end="url(#arrG)"/>

  <!-- anak left -->
  <g filter="url(#sh)"><ellipse cx="96" cy="234" rx="37" ry="25" fill="url(#anakG)" stroke="#ffffff" stroke-width="2.5"/></g>
  <text x="96" y="239" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Anak</text>
  <rect x="46" y="270" width="112" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="102" y="286" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Frekuensi</text>
  <text x="102" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">pendekatan</text>

  <!-- anak bottom (suckling) -->
  <line x1="352" y1="303" x2="352" y2="288" stroke="#f59e0b" stroke-width="3.5" marker-end="url(#arrO)"/>
  <g filter="url(#sh)"><ellipse cx="352" cy="330" rx="36" ry="24" fill="url(#anakG)" stroke="#ffffff" stroke-width="2.5"/></g>
  <text x="352" y="335" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Anak</text>
  <rect x="404" y="364" width="138" height="40" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="473" y="380" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Durasi keberadaan</text>
  <text x="473" y="396" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">di area ambing</text>

  <!-- anak outside -->
  <g filter="url(#sh)"><ellipse cx="563" cy="110" rx="36" ry="24" fill="url(#anakOutG)" stroke="#ffffff" stroke-width="2.5"/></g>
  <text x="563" y="115" text-anchor="middle" font-size="14" font-weight="800" fill="#ffffff">Anak</text>
  <g filter="url(#sh)"><circle cx="553" cy="186" r="20" fill="#ef4444" stroke="#ffffff" stroke-width="2.5"/></g>
  <path d="M545,178 L561,194 M561,178 L545,194" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="587" y="168" width="156" height="40" rx="10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="665" y="184" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">Tidak muncul aktivitas</text>
  <text x="665" y="200" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">menyusu</text>

  <!-- legend -->
  <rect x="24" y="428" width="722" height="56" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="42" y="442" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="84" y="453" font-size="13" fill="#1e293b">Zona kedekatan anak terhadap</text>
  <text x="84" y="470" font-size="13" fill="#1e293b">induk</text>
  <rect x="378" y="442" width="30" height="28" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2.5"/>
  <text x="420" y="453" font-size="13" fill="#1e293b">Zona sekitar ambing sebagai tanda adanya</text>
  <text x="420" y="470" font-size="13" fill="#1e293b">aktivitas menyusu</text>
</svg>
