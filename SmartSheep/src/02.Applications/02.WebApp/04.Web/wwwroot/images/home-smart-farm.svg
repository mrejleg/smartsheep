<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">SmartSheep smart farm</title>
  <desc id="desc">A connected smart barn with a flock of sheep, CCTV, environmental sensors, and livestock monitoring.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e9f9f6"/><stop offset="1" stop-color="#d8f1eb"/></linearGradient>
    <linearGradient id="barn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00a99d"/><stop offset="1" stop-color="#007b72"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#008178"/><stop offset="1" stop-color="#00675f"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#173f47"/><stop offset="1" stop-color="#071f27"/></linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="170%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#00675f" flood-opacity=".14"/></filter>
    <clipPath id="farmPanelClip"><rect x="38" y="45" width="644" height="455" rx="58"/></clipPath>
  </defs>
